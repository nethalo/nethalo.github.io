{% if page.show_bottomnavs %}
<div class="post-navigation">
  <div class="row">
    <div class="col-md-6">
      {% if page.previous %}
      <div class="card">
        <div class="card-body">
          <h6 class="text-muted mb-2">
            <i class="fas fa-arrow-left"></i> Previous Post
          </h6>
          <h5 class="card-title">
            <a href="{{ page.previous.url | relative_url }}" class="text-decoration-none">{{ page.previous.title }}</a>
          </h5>
        </div>
      </div>
      {% endif %}
    </div>
    <div class="col-md-6">
      {% if page.next %}
      <div class="card">
        <div class="card-body">
          <h6 class="text-muted mb-2 text-md-end">
            Next Post <i class="fas fa-arrow-right"></i>
          </h6>
          <h5 class="card-title text-md-end">
            <a href="{{ page.next.url | relative_url }}" class="text-decoration-none">{{ page.next.title }}</a>
          </h5>
        </div>
      </div>
      {% endif %}
    </div>
  </div>
</div>
{% endif %}
