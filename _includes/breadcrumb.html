{% if page.show_breadcrumb and page.breadcrumb_list %}
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    {% for item in page.breadcrumb_list %}
    <li class="breadcrumb-item"><a href="{{ item.url | relative_url }}">{{ item.label }}</a></li>
    {% endfor %}
    <li class="breadcrumb-item active" aria-current="page">{{ page.title }}</li>
  </ol>
</nav>
{% endif %}
