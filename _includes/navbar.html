<nav class="navbar navbar-expand-{{ site.navbar.expand | default: 'md' }} navbar-light">
  <div class="container">
    <a class="navbar-brand" href="{{ site.navbar.brand.url | default: '/' | relative_url }}">
      <div class="navbar-logo">R</div>
      {{ site.navbar.brand.title | default: site.title }}
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        {% for item in site.navbar.nav %}
        <li class="nav-item">
          <a class="nav-link{% if page.url == item.url %} active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
        </li>
        {% endfor %}
        {% if site.search.provider %}
        <li class="nav-item">
          <a class="nav-link" href="{{ site.search.landing_page | default: '/search' | relative_url }}">
            <i class="fas fa-search"></i> {{ site.search.label | default: 'Search' }}
          </a>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
